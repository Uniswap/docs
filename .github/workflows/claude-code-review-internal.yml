name: PR Review (internal)

# AI review of docs PRs using the official anthropics/claude-code-action.
#
# This workflow is for same-repo PRs only. It uses the GitHub OIDC path for
# Claude authentication and keeps the prompt/tooling aligned with base-branch
# context.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR at a time; a new push supersedes the in-flight run.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - id: review_prompt
        uses: ./.github/actions/claude-review-prompt
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ github.event.pull_request.number }}

      - uses: anthropics/claude-code-action@1298632ce7736903d02a1435002705aa2a594a6c # v1.0.175
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.review_prompt.outputs.prompt }}

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
